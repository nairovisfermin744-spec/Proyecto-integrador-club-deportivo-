name: Build Windows Forms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurar dependencias
        run: dotnet restore ClubDeportivo.sln
      - name: Compilar
        run: dotnet build ClubDeportivo.sln --configuration Release --no-restore
